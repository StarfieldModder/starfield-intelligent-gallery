name: Validate Launcher (DryRun)

on:
  push:
    paths:
      - 'Tools/launchers/**'
  pull_request:
    paths:
      - 'Tools/launchers/**'

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PowerShell
        uses: microsoft/setup-powershell@v2

      - name: Syntax check launcher
        run: |
          pwsh -NoProfile -Command "Test-Path Tools/launchers/starfield-turbo-launcher.ps1 -PathType Leaf; if (-not $?) { throw 'Launcher missing' }"
          pwsh -NoProfile -Command "powershell -NoProfile -Command { param($p) & $p -DryRun } -ArgumentList 'Tools/launchers/starfield-turbo-launcher.ps1'"

      - name: Run DryRun (safety)
        run: |
          pwsh -NoProfile -File Tools/launchers/starfield-turbo-launcher.ps1 -DryRun -VerboseLogging

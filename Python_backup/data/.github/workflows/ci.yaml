# ===============================================================
# File: .github/workflows/ci.yml
# Location: .github/workflows/
# Author: Mark J. Latsha
# Co-Author: Microsoft Copilot
# Created: 2026-05-27
# Description:
#   GitHub Actions CI workflow (Node.js matrix) for the project.
#   Runs on push and pull_request to main. Installs deps and runs tests.
# Notes:
#   - Matrix covers Node 16, 18, 20 for broad compatibility.
# ===============================================================
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16, 18, 20]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          npm ci || npm install

      - name: Run tests
        run: npm test

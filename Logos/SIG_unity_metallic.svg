<svg xmlns="[w3.org](http://www.w3.org/2000/svg)" viewBox="0 0 2048 2048" width="2048" height="2048">  <defs>    <!-- Color palette -->    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">      <stop offset="0%" stop-color="#C9A24A"/>      <stop offset="50%" stop-color="#E8D5A3"/>      <stop offset="100%" stop-color="#7B5E3A"/>    </linearGradient>    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">      <stop offset="0%" stop-color="#7B5E3A"/>      <stop offset="50%" stop-color="#A08050"/>      <stop offset="100%" stop-color="#4A3518"/>    </linearGradient>    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">      <stop offset="0%" stop-color="#FFB36B" stop-opacity="1"/>      <stop offset="40%" stop-color="#FFB36B" stop-opacity="0.6"/>      <stop offset="100%" stop-color="#FFB36B" stop-opacity="0"/>    </radialGradient>    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">      <feGaussianBlur stdDeviation="15" result="blur"/>      <feMerge>        <feMergeNode in="blur"/>        <feMergeNode in="SourceGraphic"/>      </feMerge>    </filter>    <filter id="rimLight" x="-20%" y="-20%" width="140%" height="140%">      <feGaussianBlur stdDeviation="3"/>    </filter>  </defs>    <!-- LAYER 1: Background -->  <g id="background">    <rect width="2048" height="2048" fill="#071428"/>    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">      <stop offset="0%" stop-color="#0A1E3C" stop-opacity="1"/>      <stop offset="100%" stop-color="#071428" stop-opacity="1"/>    </radialGradient>    <rect width="2048" height="2048" fill="url(#bgGlow)"/>  </g>    <!-- LAYER 2: Outer Ring (15° tilt visualized as ellipse) -->  <g id="outer_ring" transform="translate(1024, 1024)">    <ellipse rx="580" ry="560" fill="none" stroke="url(#goldGrad)" stroke-width="12" opacity="0.9"/>    <!-- Filigree symbols on outer face -->    <ellipse rx="580" ry="560" fill="none" stroke="#E8D5A3" stroke-width="1" stroke-dasharray="8 12" opacity="0.7"/>    <!-- 36 interior lights -->    <g id="outer_lights" fill="#FFB36B" filter="url(#bloom)">      <circle cx="580" cy="0" r="4"/><circle cx="570" cy="60" r="4"/><circle cx="540" cy="115" r="4"/>      <circle cx="500" cy="165" r="4"/><circle cx="450" cy="205" r="4"/><circle cx="390" cy="240" r="4"/>      <circle cx="330" cy="260" r="4"/><circle cx="265" cy="275" r="4"/><circle cx="200" cy="280" r="4"/>      <circle cx="135" cy="270" r="4"/><circle cx="75" cy="250" r="4"/><circle cx="20" cy="220" r="4"/>      <circle cx="-30" cy="180" r="4"/><circle cx="-75" cy="135" r="4"/><circle cx="-110" cy="85" r="4"/>      <circle cx="-140" cy="30" r="4"/><circle cx="-160" cy="-25" r="4"/><circle cx="-170" cy="-85" r="4"/>      <circle cx="-170" cy="-145" r="4"/><circle cx="-160" cy="-205" r="4"/><circle cx="-140" cy="-260" r="4"/>      <circle cx="-110" cy="-310" r="4"/><circle cx="-70" cy="-355" r="4"/><circle cx="-25" cy="-390" r="4"/>      <circle cx="25" cy="-420" r="4"/><circle cx="80" cy="-440" r="4"/><circle cx="140" cy="-450" r="4"/>      <circle cx="200" cy="-455" r="4"/><circle cx="260" cy="-445" r="4"/><circle cx="320" cy="-425" r="4"/>      <circle cx="375" cy="-400" r="4"/><circle cx="430" cy="-365" r="4"/><circle cx="475" cy="-320" r="4"/>      <circle cx="515" cy="-270" r="4"/><circle cx="545" cy="-215" r="4"/><circle cx="565" cy="-155" r="4"/>      <circle cx="575" cy="-95" r="4"/><circle cx="580" cy="-30" r="4"/>    </g>  </g>    <!-- LAYER 3: Middle Ring (30° tilt) -->  <g id="middle_ring" transform="translate(1024, 1024)">    <ellipse rx="420" ry="364" fill="none" stroke="url(#bronzeGrad)" stroke-width="12" opacity="0.9"/>    <!-- Filigree symbols -->    <ellipse rx="420" ry="364" fill="none" stroke="#A08050" stroke-width="1" stroke-dasharray="6 10" opacity="0.7"/>    <!-- 36 interior lights -->    <g id="middle_lights" fill="#FFB36B" filter="url(#bloom)">      <circle cx="420" cy="0" r="4"/><circle cx="410" cy="42" r="4"/><circle cx="385" cy="82" r="4"/>      <circle cx="355" cy="118" r="4"/><circle cx="315" cy="150" r="4"/><circle cx="270" cy="175" r="4"/>      <circle cx="220" cy="195" r="4"/><circle cx="170" cy="208" r="4"/><circle cx="115" cy="215" r="4"/>      <circle cx="60" cy="212" r="4"/><circle cx="8" cy="200" r="4"/><circle cx="-40" cy="180" r="4"/>      <circle cx="-85" cy="155" r="4"/><circle cx="-125" cy="122" r="4"/><circle cx="-158" cy="85" r="4"/>      <circle cx="-185" cy="42" r="4"/><circle cx="-205" cy="0" r="4"/><circle cx="-215" cy="-45" r="4"/>      <circle cx="-218" cy="-90" r="4"/><circle cx="-212" cy="-135" r="4"/><circle cx="-198" cy="-178" r="4"/>      <circle cx="-175" cy="-218" r="4"/><circle cx="-145" cy="-255" r="4"/><circle cx="-108" cy="-285" r="4"/>      <circle cx="-65" cy="-310" r="4"/><circle cx="-20" cy="-328" r="4"/><circle cx="28" cy="-338" r="4"/>      <circle cx="78" cy="-340" r="4"/><circle cx="128" cy="-335" r="4"/><circle cx="175" cy="-320" r="4"/>      <circle cx="220" cy="-298" r="4"/><circle cx="260" cy="-270" r="4"/><circle cx="295" cy="-235" r="4"/>      <circle cx="325" cy="-195" r="4"/><circle cx="348" cy="-152" r="4"/><circle cx="362" cy="-105" r="4"/>      <circle cx="370" cy="-58" r="4"/><circle cx="375" cy="-12" r="4"/>    </g>  </g>    <!-- LAYER 4: Inner Ring (45° tilt) -->  <g id="inner_ring" transform="translate(1024, 1024)">    <ellipse rx="260" ry="184" fill="none" stroke="url(#goldGrad)" stroke-width="12" opacity="0.9"/>    <!-- Filigree symbols -->    <ellipse rx="260" ry="184" fill="none" stroke="#E8D5A3" stroke-width="1" stroke-dasharray="5 8" opacity="0.7"/>    <!-- 36 interior lights -->    <g id="inner_lights" fill="#FFB36B" filter="url(#bloom)">      <circle cx="260" cy="0" r="4"/><circle cx="255" cy="28" r="4"/><circle cx="240" cy="55" r="4"/>      <circle cx="218" cy="78" r="4"/><circle cx="190" cy="98" r="4"/><circle cx="158" cy="112" r="4"/>      <circle cx="125" cy="122" r="4"/><circle cx="90" cy="126" r="4"/><circle cx="55" cy="125" r="4"/>      <circle cx="22" cy="118" r="4"/><circle cx="-10" cy="105" r="4"/><circle cx="-38" cy="88" r="4"/>      <circle cx="-62" cy="68" r="4"/><circle cx="-82" cy="45" r="4"/><circle cx="-97" cy="20" r="4"/>      <circle cx="-106" cy="-5" r="4"/><circle cx="-110" cy="-32" r="4"/><circle cx="-108" cy="-58" r="4"/>      <circle cx="-100" cy="-84" r="4"/><circle cx="-87" cy="-108" r="4"/><circle cx="-70" cy="-130" r="4"/>      <circle cx="-48" cy="-148" r="4"/><circle cx="-24" cy="-162" r="4"/><circle cx="2" cy="-172" r="4"/>      <circle cx="30" cy="-178" r="4"/><circle cx="58" cy="-178" r="4"/><circle cx="86" cy="-174" r="4"/>      <circle cx="112" cy="-165" r="4"/><circle cx="138" cy="-150" r="4"/><circle cx="160" cy="-132" r="4"/>      <circle cx="180" cy="-110" r="4"/><circle cx="195" cy="-85" r="4"/><circle cx="206" cy="-58" r="4"/>      <circle cx="212" cy="-30" r="4"/><circle cx="215" cy="-2" r="4"/><circle cx="214" cy="26" r="4"/>      <circle cx="208" cy="54" r="4"/>    </g>  </g>    <!-- LAYER 5: Core Gem -->  <g id="core_gem" transform="translate(1024, 1024)">    <circle cx="0" cy="0" r="45" fill="url(#coreGlow)" filter="url(#bloom)"/>    <circle cx="0" cy="0" r="25" fill="#FFB36B" opacity="0.9"/>    <circle cx="0" cy="0" r="15" fill="#FFE4C4" opacity="0.8"/>  </g>    <!-- LAYER 6: Particle Dust -->  <g id="particles" transform="translate(1024, 1024)" opacity="0.6">    <circle cx="120" cy="-80" r="2" fill="#FFB36B" opacity="0.4"/>    <circle cx="-150" cy="60" r="1.5" fill="#FFB36B" opacity="0.3"/>    <circle cx="80" cy="140" r="2" fill="#FFB36B" opacity="0.5"/>    <circle cx="-90" cy="-120" r="1" fill="#FFB36B" opacity="0.4"/>    <circle cx="180" cy="40" r="1.5" fill="#FFB36B" opacity="0.3"/>    <circle cx="-60" cy="160" r="2" fill="#FFB36B" opacity="0.35"/>    <circle cx="200" cy="-60" r="1" fill="#FFB36B" opacity="0.45"/>    <circle cx="-180" cy="-40" r="2" fill="#FFB36B" opacity="0.3"/>    <circle cx="40" cy="-180" r="1.5" fill="#FFB36B" opacity="0.4"/>    <circle cx="-140" cy="100" r="1" fill="#FFB36B" opacity="0.5"/>    <circle cx="160" cy="120" r="2" fill="#FFB36B" opacity="0.25"/>    <circle cx="-200" cy="20" r="1.5" fill="#FFB36B" opacity="0.35"/>    <circle cx="100" cy="180" r="1" fill="#FFB36B" opacity="0.4"/>    <circle cx="-40" cy="-160" r="2" fill="#FFB36B" opacity="0.3"/>    <circle cx="220" cy="10" r="1.5" fill="#FFB36B" opacity="0.45"/>    <circle cx="-120" cy="-140" r="1" fill="#FFB36B" opacity="0.35"/>  </g>    <!-- LAYER 7: Rim Light Overlay -->  <g id="rim_light" transform="translate(1024, 1024)" opacity="0.5" filter="url(#rimLight)">    <ellipse rx="580" ry="560" fill="none" stroke="#E8D5A3" stroke-width="3"/>    <ellipse rx="420" ry="364" fill="none" stroke="#A08050" stroke-width="3"/>    <ellipse rx="260" ry="184" fill="none" stroke="#E8D5A3" stroke-width="3"/>  </g></svg>CSS/JS Animation Spec (matches your keyframes):css@keyframes orbBreathe {  0% { transform: translate(1024px, 1024px) scale(0.98); }  10% { transform: translate(1024px, 1024px) scale(1.01); }  70% { transform: translate(1024px, 1024px) scale(1.03); }  100% { transform: translate(1024px, 1024px) scale(1.00); }}@keyframes corePulse {  0% { opacity: 0; }  70% { opacity: 1; }  100% { opacity: 0.4; }}@keyframes ringSpin1 {  0% { transform: translate(1024px, 1024px) rotateY(0deg); }  100% { transform: translate(1024px, 1024px) rotateY(360deg); }}@keyframes ringSpin2 {  0% { transform: translate(1024px, 1024px) rotateY(0deg); }  100% { transform: translate(1024px, 1024px) rotateY(-360deg); }}@keyframes ringSpin3 {  0% { transform: translate(1024px, 1024px) rotateX(0deg); }  100% { transform: translate(1024px, 1024px) rotateX(360deg); }}@keyframes particleDrift {  0% { transform: translate(1024px, 1024px) translate(0, 0); opacity: 0.6; }  100% { transform: translate(1024px, 1024px) translate(40px, -30px); opacity: 0.2; }}#outer_ring { animation: ringSpin1 20s linear infinite; }#middle_ring { animation: ringSpin2 15s linear infinite; }#inner_ring { animation: ringSpin3 12s linear infinite; }#core_gem { animation: corePulse 1.5s ease-in-out infinite; }#particles { animation: particleDrift 3s ease-out infinite; }svg > g { transform-origin: center; }